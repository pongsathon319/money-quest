<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money Quest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#181b21">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>KruIce Money Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>window.SPRITES = [1,2,3,4,5].map(n => 'img/state'+n+'.webp');</script>
<script>
  // ใช้ธีมล่าสุดทันทีก่อนวาดหน้า (กันจอกระพริบ)
  try { document.documentElement.dataset.theme = localStorage.getItem('mq_theme') || 'dark'; } catch(e) {}
</script>
<style>
/* =================== THEMES =================== */
:root{
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --tab-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --font:'IBM Plex Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
/* 1) Dark — เทาถ่านอมน้ำเงิน ไม่ดำสนิท */
[data-theme=dark]{
  --bg:#181b21; --bg-2:#1d2128; --surface:#22262e; --surface-2:#2b3039; --surface-3:#363c47;
  --border:rgba(255,255,255,.07); --text:#eceef3; --text-2:#a7adba; --text-3:#727988;
  --primary:#8fa3ff; --primary-2:#7389f2; --on-primary:#12151c; --tint:rgba(143,163,255,.13);
  --pos:#5fd3a0; --neg:#ff8577; --warn:#f2b45a; --info:#7db7ff;
  --s1:#4fd08f; --s2:#a3d65c; --s3:#f2c14e; --s4:#f49a4d; --s5:#f06a6a;
  --c1:#8fa3ff; --c2:#5fd3a0; --c3:#f2b45a; --c4:#ff8577; --c5:#c79bff; --c6:#5cc8d6; --c7:#f59bc6; --c8:#a7b0c0;
  --shadow:0 10px 30px rgba(0,0,0,.28); --hero-glow:rgba(143,163,255,.16);
  color-scheme:dark;
}
/* 2) White — ขาวขุ่นอมเทา มินิมอล */
[data-theme=light]{
  --bg:#ebeae6; --bg-2:#e4e2dd; --surface:#f6f5f2; --surface-2:#e9e7e2; --surface-3:#dddad4;
  --border:rgba(25,25,35,.08); --text:#1f2228; --text-2:#5d616b; --text-3:#8e919a;
  --primary:#3f4a63; --primary-2:#2f394f; --on-primary:#f6f5f2; --tint:rgba(63,74,99,.08);
  --pos:#24885b; --neg:#c94b44; --warn:#b6781d; --info:#3b6fb3;
  --s1:#2f9e63; --s2:#77a43a; --s3:#c79f25; --s4:#d67a33; --s5:#cc4a45;
  --c1:#3f4a63; --c2:#2f9e8a; --c3:#d6a13a; --c4:#cc5f52; --c5:#8a74c9; --c6:#5b93c7; --c7:#c98aa6; --c8:#9a9ca3;
  --shadow:0 1px 2px rgba(30,30,40,.04),0 8px 22px rgba(30,30,40,.06); --hero-glow:rgba(63,74,99,.08);
  color-scheme:light;
}
/* 3) Earth tone — มอสเขียว · ส้มดินเผา · ฟ้าธรรมชาติ บนพื้นทราย */
[data-theme=earth]{
  --bg:#ebe2d0; --bg-2:#e3d8c2; --surface:#f5eee1; --surface-2:#e8dcc6; --surface-3:#dccdb1;
  --border:rgba(80,58,25,.11); --text:#2e2a21; --text-2:#6c6250; --text-3:#9a8e78;
  --primary:#56744a; --primary-2:#466239; --on-primary:#f6f0e4; --tint:rgba(86,116,74,.12);
  --pos:#4f7d43; --neg:#bf5a30; --warn:#c48a2a; --info:#4c84a6;
  --s1:#4f7d43; --s2:#8c9b45; --s3:#c99d36; --s4:#c9733a; --s5:#b0472e;
  --c1:#56744a; --c2:#c9733a; --c3:#4c84a6; --c4:#c99d36; --c5:#8b6a4f; --c6:#7fa28a; --c7:#b5654f; --c8:#a59a83;
  --shadow:0 1px 2px rgba(70,50,20,.05),0 8px 22px rgba(70,50,20,.08); --hero-glow:rgba(86,116,74,.12);
  color-scheme:light;
}

/* =================== BASE =================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:520px;margin:0 auto;padding:calc(10px + var(--safe-t)) 16px calc(var(--tab-h) + var(--safe-b) + 20px)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--text-2)} .faint{color:var(--text-3)} .pos{color:var(--pos)} .neg{color:var(--neg)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 14px}
.top .hi{font-size:13px;color:var(--text-2)}
.top h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text-2)}
.iconbtn:active{transform:scale(.95)}

.view{display:none}
.view.on{display:block;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-h h3{margin:0;font-size:15.5px;font-weight:600}
.card-h .aside{font-size:12.5px;color:var(--text-3)}
.link{border:0;background:none;color:var(--primary);font-size:13.5px;font-weight:500;padding:4px 2px}
.sec-t{font-size:12.5px;font-weight:600;color:var(--text-3);letter-spacing:.04em;margin:18px 4px 8px}

.btn{border:1px solid var(--border);background:var(--surface-2);border-radius:14px;padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:11px}
.btn.danger{color:var(--neg)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55}

input[type=text],input[type=number],input[type=date],select{width:100%;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 12px;outline:none;font-size:16px}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--tint)}
label.f{display:block;font-size:13px;color:var(--text-2);margin:12px 0 6px}

.seg{display:flex;background:var(--bg-2);border:1px solid var(--border);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:10px;font-size:14px;font-weight:500;color:var(--text-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s ease}

/* =================== HOME =================== */
.hero{position:relative;overflow:hidden;padding:16px 16px 14px}
.hero::before{content:"";position:absolute;width:280px;height:280px;left:-70px;top:10px;border-radius:50%;background:radial-gradient(circle,var(--glow,var(--hero-glow)) 0%,transparent 68%);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--text-2);position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--border)}
.hero-main{display:grid;grid-template-columns:44% 1fr;gap:6px;align-items:end;position:relative;margin-top:4px}
.char{height:228px;position:relative;text-align:center;overflow:hidden}
.char img{display:inline-block;height:228px;width:auto;max-width:100%;object-fit:contain;object-position:50% 100%;vertical-align:bottom;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18));animation:breathe 3.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012) translateY(-2px)}}
.char .shadow{position:absolute;bottom:2px;left:50%;width:60%;height:10px;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.18);filter:blur(4px)}
.state-t{font-size:19px;font-weight:700;line-height:1.25;margin-top:4px}
.state-d{font-size:13px;color:var(--text-2);margin-top:2px}
.pct{font-size:52px;font-weight:700;line-height:1;margin:12px 0 2px;letter-spacing:-.03em}
.pct small{font-size:22px;font-weight:600;margin-left:2px}
.remain{font-size:14px;color:var(--text-2)} .remain b{color:var(--text);font-weight:600}
.gauge{margin-top:14px;position:relative}
.gauge .segs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.gauge .sg{height:10px;border-radius:6px;background:var(--surface-3);position:relative;overflow:hidden}
.gauge .sg i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.gauge .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:5px}
.gauge .pin{position:absolute;top:-5px;width:4px;height:20px;border-radius:3px;background:var(--text);box-shadow:0 0 0 2px var(--surface);transform:translateX(-50%);transition:left .5s}
.states{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
.st{border:0;background:var(--bg-2);border-radius:10px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:var(--text-3);border:1px solid transparent}
.st img{height:34px;width:auto;max-width:100%;object-fit:contain;opacity:.55;filter:grayscale(.6)}
.st.on{border-color:var(--sc);color:var(--text);background:var(--surface-2)}
.st.on img{opacity:1;filter:none}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;position:relative}
.mini>div{background:var(--bg-2);border-radius:var(--r-sm);padding:9px 11px;border:1px solid var(--border)}
.mini .l{font-size:12px;color:var(--text-2)} .mini .v{font-size:16px;font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 12px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--text-2)} .kpi .v{font-size:17px;font-weight:600;white-space:nowrap}

.alert{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:var(--r-md);margin-bottom:8px;font-size:13.5px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--ac,var(--info))}
.alert .act{margin-left:auto;flex:none}
.alert.bad{--ac:var(--neg)} .alert.warn{--ac:var(--warn)} .alert.info{--ac:var(--info)}

.lim{margin:12px 0 2px}
.lim .h{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:6px;gap:8px}
.lim .h .k{font-weight:600;white-space:nowrap}

.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);font-size:19px;flex:none}
.item .t{font-size:14.5px} .item .s{font-size:12px;color:var(--text-3)}
.item .a{margin-left:auto;font-weight:600;white-space:nowrap}
.tap{cursor:pointer}
.empty{color:var(--text-3);font-size:14px;padding:6px 0}

/* =================== RECORD (no scroll) =================== */
body.v-add .top{display:none}
body.v-add .app{padding-top:calc(8px + var(--safe-t))}
#v-add.on{display:flex}
#v-add{flex-direction:column;gap:10px}
.r-top{display:flex;gap:8px;align-items:center}
.r-top .seg{flex:1}
.datebtn{position:relative;display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:13.5px;font-weight:500;white-space:nowrap}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0}
.amt{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px 6px;box-shadow:var(--shadow)}
.amt .head{display:flex;align-items:center;gap:10px}
.amt .ic{width:40px;height:40px;font-size:20px;background:var(--tint)}
.amt .cn{font-size:14.5px;font-weight:600;line-height:1.25}
.amt .hint{font-size:12px;color:var(--text-3);line-height:1.3}
.amt .hint.bad{color:var(--neg)} .amt .hint.warn{color:var(--warn)}
.money-row{display:flex;align-items:baseline;gap:6px}
.money-row .cur{font-size:26px;font-weight:600;color:var(--text-3)}
input.money{flex:1;min-width:0;border:0!important;background:transparent!important;box-shadow:none!important;font-size:36px!important;font-weight:700;text-align:right;padding:2px 0!important;color:var(--text)}
input.money::placeholder{color:var(--text-3)}
input.money.inc{color:var(--pos)}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px;margin:0 -16px;padding:1px 16px}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--text)}
.quick button:active{background:var(--surface-3)}
.quick button.clr{color:var(--text-3);font-weight:500}
.r-note{display:flex;gap:8px;align-items:stretch}
.note{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:0 10px;min-width:0}
.note input{border:0!important;background:transparent!important;padding:10px 0;box-shadow:none!important;font-size:16px}
.r-note .btn{padding:0 18px}
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.cat{height:66px;border:1px solid transparent;background:transparent;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px;font-size:11px;line-height:1.15;text-align:center;color:var(--text-2);min-width:0;overflow:hidden}
.cat .e{width:42px;height:42px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);font-size:21px;line-height:1;transition:background .15s}
.cat .n{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat.on{color:var(--text);font-weight:600}
.cat.on .e{background:var(--primary);border-color:var(--primary);box-shadow:0 4px 12px var(--tint)}
.cat.over .e{box-shadow:inset 0 0 0 2px var(--neg)}
.cats.mini{max-height:230px;overflow-y:auto}
@media (max-height:620px){ #v-add{gap:8px} .cat{height:58px} .cat .e{width:36px;height:36px;font-size:18px} input.money{font-size:30px!important} }
.edit-actions{display:flex;gap:8px;margin-top:16px}
.edit-actions .btn{flex:1}
.chartbox{position:relative;height:220px}
.chartbox.tall{height:250px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 4px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--text-3);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:0}

/* =================== MARKET =================== */
.mk{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.mk:last-child{border-bottom:0}
.mk .nm{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.mk .sy{font-size:12px;color:var(--text-3)}
.mk .pr{margin-left:auto;text-align:right}
.mk .pr b{font-weight:600;font-size:15.5px;display:block}
.delta{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:7px}
.delta.up{color:var(--pos);background:color-mix(in srgb,var(--pos) 14%,transparent)}
.delta.dn{color:var(--neg);background:color-mix(in srgb,var(--neg) 14%,transparent)}
.spark{width:64px;height:26px;flex:none}
.fuel .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14.5px}
.fuel .row:last-child{border-bottom:0}
.fuel .row b{font-weight:600}
.fxg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fx{background:var(--bg-2);border-radius:var(--r-sm);padding:10px;border:1px solid var(--border)}
.fx .c{font-size:12px;color:var(--text-2)} .fx .v{font-weight:600;font-size:16px}
.src{font-size:12px;color:var(--text-3);margin-top:10px}

/* =================== SETTINGS =================== */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{border:2px solid var(--border);border-radius:var(--r-md);padding:8px;background:var(--surface);text-align:center;font-size:12.5px;font-weight:500}
.th.on{border-color:var(--primary)}
.th .pv{height:58px;border-radius:10px;padding:7px;display:flex;flex-direction:column;gap:5px;margin-bottom:6px;border:1px solid rgba(0,0,0,.06)}
.th .pv i{display:block;height:8px;border-radius:4px}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.lrow:last-child{border-bottom:0}
.lrow .t{font-size:14.5px} .lrow .s{font-size:12.5px;color:var(--text-3)}
.lrow .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:500}
.tag button{border:0;background:var(--surface-3);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);font-size:12px;padding:0}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--surface-3);border-radius:99px;transition:.2s}
.sw span:before{content:"";position:absolute;width:26px;height:26px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--pos)}
.sw input:checked+span:before{transform:translateX(20px)}
.inline3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px}

/* =================== CHROME =================== */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-top:1px solid var(--border);padding:0 6px var(--safe-b)}
.tabs .in{max-width:520px;margin:0 auto;display:flex;height:var(--tab-h);align-items:center}
.tab{flex:1;border:0;background:none;color:var(--text-3);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:6px 0}
.tab.on{color:var(--primary)}
.tab.add .pl{width:48px;height:48px;border-radius:16px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 6px 16px var(--tint);margin-top:-2px}
.tab.add .pl svg{width:26px;height:26px;stroke-width:2.4}
.tab.add span.lb{display:none}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 18px calc(22px + var(--safe-b));max-height:86vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s}

<script>
/* =========================================================
   API — เรียก Apps Script (doPost) หรือโหมดตัวอย่าง
   ตั้งค่าเก็บในเครื่อง: {url, token} หรือ {demo:true}
   ========================================================= */
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
let CFG = LS.get('mq_cfg', null);
async function callApi(cfg, fn, args){
  const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 45000);
  try {
    const res = await fetch(cfg.url, {method:'POST', body:JSON.stringify({token:cfg.token, fn, args}), redirect:'follow', signal:ctl.signal});
    const txt = await res.text();
    let j; try { j = JSON.parse(txt); } catch(e) { throw new Error('API ตอบกลับไม่ใช่ JSON — ตรวจว่า Deploy แบบ “ทุกคน (Anyone)” และใช้ลิงก์ที่ลงท้ายด้วย /exec'); }
    if (!j.ok) throw new Error(j.error || 'API error');
    return j.data;
  } catch(e) {
    if (e.name==='AbortError') throw new Error('หมดเวลาเชื่อมต่อ');
    if (e instanceof TypeError) { const er = new Error('ออฟไลน์หรือเชื่อมต่อไม่ได้'); er.offline = true; throw er; }
    throw e;
  } finally { clearTimeout(tm); }
}
function api(fn, ...args){
  if (!CFG || CFG.demo) return Promise.resolve().then(() => Mock[fn](...args));
  return callApi(CFG, fn, args);
}

/* ---------- คิวบันทึก: บันทึกทันทีในเครื่อง แล้วค่อยส่งขึ้นชีต ---------- */
let QUEUE = LS.get('mq_queue', []);
let flushing = false;
function applyLocal(D, e){
  let d = D.days.find(x=>x.date===e.date);
  if (!d) { d = {date:e.date, inc:{}, exp:{}, items:{inc:{},exp:{}}, row:0, note:'', sheetSumExp:null}; D.days.push(d); }
  const k = e.type==='inc' ? 'inc' : 'exp';
  const prev = d[k][e.cat] || 0;
  d.items = d.items || {inc:{},exp:{}}; d.items[k] = d.items[k] || {};
  const arr = d.items[k][e.cat] || (prev ? [prev] : []);
  arr.push(+e.amount); d.items[k][e.cat] = arr;
  d[k][e.cat] = +((prev + +e.amount).toFixed(2));
  d.sheetSumExp = null;
  if (e.note) d.note = (d.note ? d.note+' | ' : '') + e.cat+' '+e.amount+': '+e.note;
}
/** แก้/ลบรายการย่อยในข้อมูลที่ถืออยู่ (ใช้ในโหมดตัวอย่าง) */
function editLocal(D, p){
  const d = D.days.find(x=>x.date===p.date); if (!d) return;
  const k = p.type==='inc' ? 'inc' : 'exp';
  d.items = d.items || {inc:{},exp:{}}; d.items[k] = d.items[k] || {};
  const get = c => d.items[k][c] || (d[k][c] ? [d[k][c]] : []);
  const put = (c, arr) => { arr = arr.filter(x=>x>0); if (arr.length) { d.items[k][c] = arr; d[k][c] = +arr.reduce((a,b)=>a+b,0).toFixed(2); } else { delete d.items[k][c]; delete d[k][c]; } };
  const a = get(p.cat);
  if (p.del) { a.splice(p.index,1); put(p.cat, a); }
  else if (!p.newCat || p.newCat===p.cat) { a[p.index] = +p.newAmount; put(p.cat, a); }
  else { a.splice(p.index,1); put(p.cat, a); const b = get(p.newCat); b.push(+p.newAmount); put(p.newCat, b); }
  d.sheetSumExp = null;
}
function itemsOf(d){
  const out = [];
  if (!d) return out;
  ['inc','exp'].forEach(t => Object.entries(d[t]||{}).forEach(([c,v]) => {
    const arr = (d.items && d.items[t] && d.items[t][c]) || [v];
    arr.forEach((a,i) => out.push({t, c, i, a}));
  }));
  return out;
}
function syncUI(state){
  const el = document.getElementById('sync'); if (!el) return;
  if (!CFG || CFG.demo) { el.className='sync'; el.innerHTML=''; return; }
  const n = QUEUE.length;
  if (state==='busy') { el.className='sync busy'; el.innerHTML='<i></i>กำลังซิงก์'; }
  else if (n) { el.className='sync wait'; el.innerHTML='<i></i>รอส่ง '+n+' รายการ'; }
  else { el.className='sync'; el.innerHTML='<i></i>ซิงก์แล้ว'; }
}
async function flushQueue(){
  if (flushing || !QUEUE.length || !CFG || CFG.demo) return syncUI();
  flushing = true; syncUI('busy');
  const batch = QUEUE.slice();
  try {
    const D = await api('addEntries', batch);
    QUEUE = QUEUE.filter(q => !batch.some(b=>b.id===q.id)); LS.set('mq_queue', QUEUE);
    receive(D);
  } catch(e) {
    if (!e.offline) toast('ส่งขึ้นชีตไม่สำเร็จ: '+esc(errMsg(e)), 4000);
  } finally { flushing = false; syncUI(); }
}
window.addEventListener('online', flushQueue);
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') { flushQueue(); refresh(); } });
setInterval(flushQueue, 30000);

/** รับข้อมูลใหม่จากเซิร์ฟเวอร์: เก็บแคช + ใส่รายการที่ยังรอส่งกลับเข้าไป แล้ววาดใหม่ */
function receive(D){
  if (CFG && !CFG.demo) LS.set('mq_data', D);
  const copy = JSON.parse(JSON.stringify(D));
  QUEUE.forEach(e => applyLocal(copy, e));
  setData(copy);
  if (S.view && !(S.view==='add' && document.activeElement && document.activeElement.id==='note')) rerender();
}
let refreshing = false;
async function refresh(){
  if (refreshing || !CFG || CFG.demo || flushing) return;
  refreshing = true; syncUI('busy');
  try { receive(await api('getAppData')); }
  catch(e) { if (!e.offline) toast('โหลดข้อมูลไม่สำเร็จ: '+esc(errMsg(e)), 4000); }
  finally { refreshing = false; syncUI(); }
}

const fmt = (n, d) => { n = +n || 0; const dec = d!=null ? d : (Math.abs(n%1)>0.001 ? 2 : 0); return n.toLocaleString('th-TH',{minimumFractionDigits:dec,maximumFractionDigits:dec}); };
const baht = (n,d) => '฿'+fmt(n,d);

const addDays = (s, n) => { const d = pDate(s); d.setDate(d.getDate()+n); return iso(d); };

];

/* =========================================================
   Model
   ========================================================= */
const S = { data:null, model:null, market:null, view:'home', addType:'exp', addCat:null, addDate:null, amt:'0', note:'', statTab:'day', statMonth:null, charts:{}, preview:null };
S.amt = '';

function buildModel(D){
  const st = D.settings;
  const days = D.days.slice().sort((a,b)=>a.date<b.date?-1:1);
  const byDate = {};
  let run = 0;
  days.forEach(d => { d.incT = sum(d.inc); d.expT = sum(d.exp); run += d.incT - d.expT; d.bal = run; byDate[d.date] = d; });
  const today = D.today, month = today.slice(0,7);
  const td = byDate[today] || {date:today,inc:{},exp:{},incT:0,expT:0};

  // --- รอบเงินเดือน: ตั้งแต่วันที่เงินเดือนเข้าล่าสุด ถึงก่อนเงินเดือนรอบถัดไป
  const salaryCat = D.incomeCats.find(c=>/เงินเดือน/.test(c)) || D.incomeCats[0];
  const salDays = days.filter(d => d.date <= today && d.inc[salaryCat] > 0);
  const lastSal = salDays[salDays.length-1];
  const lastSalary = lastSal ? lastSal.inc[salaryCat] : 0;
  const payDay = +st.payday || (lastSal ? pDate(lastSal.date).getDate() : 25);
  let nextPay = (() => { let d = pDate(today); for (let i=1;i<=62;i++){ d.setDate(d.getDate()+1); const want=Math.min(payDay, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate()); if (d.getDate()===want) return iso(d); } return addDays(today,30); })();
  const cycleStart = lastSal ? lastSal.date : month+'-01';
  const cDays = days.filter(d => d.date >= cycleStart && d.date <= today);
  const cInc = cDays.reduce((a,d)=>a+d.incT,0);
  const cExp = cDays.reduce((a,d)=>a+d.expT,0);
  const base = cInc || lastSalary;
  const remain = base - cExp;
  const pct = base ? clamp(remain/base, 0, 1) : 0;
  const state = stateOf(pct);
  const daysLeft = Math.max(1, diffDays(today, nextPay));
  const perDay = Math.max(0, remain) / daysLeft;
  const cycleLen = Math.max(28, diffDays(cycleStart, nextPay));
  const goal = (+st.savingGoalPct||0)/100;
  const dailyBudget = +st.dailyBudget || (base ? Math.round(base*(1-goal)/cycleLen) : 0);

  // --- ลิมิต
  const catMonth = (cat, ym) => days.filter(d=>d.date.slice(0,7)===ym).reduce((a,d)=>a+(d.exp[cat]||0),0);
  const limits = Object.entries(st.limits||{}).map(([cat,l]) => {
    const t = td.exp[cat]||0, m = catMonth(cat, month);
    return {cat, daily:+l.daily||0, monthly:+l.monthly||0, today:t, month:m,
      dOver: +l.daily && t>l.daily, mOver: +l.monthly && m>l.monthly, mWarn: +l.monthly && m>l.monthly*.8};
  });

  // --- เรียงหมวดตามความถี่ที่ใช้
  const freq = {}; days.forEach(d => { Object.keys(d.exp).forEach(c=>freq[c]=(freq[c]||0)+1); Object.keys(d.inc).forEach(c=>freq[c]=(freq[c]||0)+1); });
  const byFreq = list => list.map((c,i)=>({c,i})).sort((a,b)=>(freq[b.c]||0)-(freq[a.c]||0) || a.i-b.i).map(x=>x.c);

  const last30 = days.filter(d => d.date > addDays(today,-30) && d.date <= today && (d.expT||d.incT));
  const avgDaily = last30.length ? last30.reduce((a,d)=>a+d.expT,0) / Math.max(1, diffDays(last30[0].date, today)+1) : 0;
  const mismatch = days.filter(d => d.sheetSumExp!=null && Math.abs(d.sheetSumExp - d.expT) > 0.009);
  const months = [...new Set(days.map(d=>d.date.slice(0,7)))].sort();
  return {days, byDate, today, month, td, balance:run, salaryCat, lastSalary, payDay, nextPay, cycleStart, cInc, cExp, base, remain, pct, state, daysLeft, perDay, dailyBudget,
    limits, catMonth, expOrder: byFreq(D.expenseCats), incOrder: byFreq(D.incomeCats), avgDaily, mismatch, months};
}

      </div>

          <div class="state-t">${st.t}</div>

            ? `<div class="pct num" style="color:${sc};font-size:34px">${st.min}–${st.min+20}<small>%</small></div><div class="remain">ตัวอย่างสถานะนี้ · แตะอีกครั้งเพื่อกลับ</div>`

function previewState(n){ S.preview = (S.preview===n || n===S.model.state.n) ? null : n; renderHome(); if (S.preview) setTimeout(()=>{ if(S.preview===n){ S.preview=null; if(S.view==='home') renderHome(); } }, 3500); }
function limBar(cat, lbl, v, max){
  const p = v/max, c = p>1 ? 'var(--neg)' : p>.8 ? 'var(--warn)' : 'var(--pos)';
  return `<div class="lim"><div class="h"><span>${icon(cat)} ${esc(cat)} <span class="faint">· ${lbl}</span></span><span class="k num" style="color:${c}">${fmt(v)} / ${fmt(max)}</span></div><div class="bar"><i style="width:${Math.min(100,p*100)}%;background:${c}"></i></div></div>`;
}

  const cnt = itemsOf(day).length;
  $('#v-add').innerHTML = `
    <div class="r-top">
      <div class="seg" id="typeSeg">
        <button data-v="exp" class="${S.addType==='exp'?'on':''}">รายจ่าย</button>
        <button data-v="inc" class="${S.addType==='inc'?'on':''}">รายรับ</button>
      </div>
      <label class="datebtn">${I.cal}<span>${S.addDate===M.today?'วันนี้':thDate(S.addDate)}</span><input type="date" id="addDate" value="${S.addDate}" max="${M.today}"></label>
      <button class="iconbtn" style="position:relative" onclick="dayItems(S.addDate)" aria-label="รายการของวัน">${I.list}${cnt?`<span style="position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--primary);color:var(--on-primary);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px">${cnt}</span>`:''}</button>
    </div>

      <div class="money-row"><span class="cur">฿</span><input class="money num ${S.addType==='inc'?'inc':''}" id="amt" type="text" inputmode="decimal" placeholder="0" autocomplete="off" enterkeyhint="done" value="${esc(S.amt)}"></div>
    </div>
    <div class="quick" id="quick">${[5,20,30,50,100,500,1000].map(n=>`<button data-q="${n}">+${n.toLocaleString('th-TH')}</button>`).join('')}<button class="clr" data-q="0">ล้าง</button></div>
    <div class="r-note">
      <label class="note">${I.note}<input type="text" id="note" placeholder="หมายเหตุ (ไม่บังคับ)" value="${esc(S.note)}" enterkeyhint="done"></label>
      <button class="btn primary" id="saveBtn">${I.check}บันทึก</button>
    </div>
    <div class="cats" id="cats">
      ${cats.map(c=>`<button type="button" class="cat ${c===S.addCat?'on':''}" data-c="${esc(c)}"><span class="e">${icon(c)}</span><span class="n">${esc(c)}</span></button>`).join('')}
      <button type="button" class="cat" id="newCat"><span class="e">＋</span><span class="n">เพิ่มหมวด</span></button>
    </div>`;

  $$('#typeSeg button').forEach(b => b.onclick = () => { S.addType = b.dataset.v; S.addCat = null; renderAdd(); });
  $('#addDate').onchange = e => { S.addDate = e.target.value || M.today; renderAdd(); };
  $$('#cats .cat[data-c]').forEach(el => el.addEventListener('click', () => {
    S.addCat = el.dataset.c;
    $$('#cats .cat').forEach(x => x.classList.toggle('on', x === el));
    $('#aIc').textContent = icon(S.addCat); $('#aCn').textContent = S.addCat;
    markOver(); showHint();
  }));
  $('#newCat').addEventListener('click', newCategory);
  const inp = $('#amt');
  inp.addEventListener('input', () => {
    let v = inp.value.replace(/,/g,'.').replace(/[^0-9.]/g,'');
    const p = v.split('.'); if (p.length > 2) v = p[0]+'.'+p.slice(1).join('');
    const [a,b] = v.split('.'); if (b!=null && b.length>2) v = a+'.'+b.slice(0,2);
    if (v !== inp.value) inp.value = v;
    S.amt = v; showHint();
  });
  inp.addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); inp.blur(); } });
  // ปุ่มลัด: กดแล้วคีย์บอร์ดไม่ปิด
  $$('#quick button').forEach(b => {
    b.addEventListener('pointerdown', e => e.preventDefault());
    b.addEventListener('mousedown', e => e.preventDefault());

    });

  $('#saveBtn').addEventListener('pointerdown', e => e.preventDefault());
  $('#saveBtn').addEventListener('click', saveEntry);
  markOver(); showHint();

function markOver(){
  const M = S.model, lmap = S.data.settings.limits||{}, day = M.byDate[S.addDate];
  $$('#cats .cat[data-c]').forEach(el => {
    const c = el.dataset.c, l = lmap[c];
    const over = S.addType==='exp' && l && ((+l.daily && (day?.exp[c]||0)>=l.daily) || (+l.monthly && M.catMonth(c,S.addDate.slice(0,7))>=l.monthly));
    el.classList.toggle('over', !!over);
  });
}
function showHint(){
  const M = S.model, h = $('#hint'); if (!h) return;
  const a = parseFloat(S.amt) || 0;
  const day = M.byDate[S.addDate];
  const l = (S.data.settings.limits||{})[S.addCat];
  const t = (S.addType==='exp' ? day?.exp[S.addCat] : day?.inc[S.addCat]) || 0;
  let txt = t ? `${S.addDate===M.today?'วันนี้':thDate(S.addDate)}แล้ว ${baht(t)}` : (S.addType==='exp' ? 'ยังไม่มีรายการในหมวดนี้' : 'รายรับ');
  let cls = '';
  if (S.addType==='exp' && l) {
    const m = M.catMonth(S.addCat, S.addDate.slice(0,7));
    if (+l.daily) { const n=t+a; txt = `วันนี้ ${fmt(n)} / ${fmt(l.daily)}`; if (n>l.daily) cls='bad'; else if (n>l.daily*.8) cls='warn'; }
    if (+l.monthly) { const n=m+a; txt += (+l.daily?' · ':'') + `เดือนนี้ ${fmt(n)} / ${fmt(l.monthly)}`; if (n>l.monthly) cls='bad'; else if (!cls && n>l.monthly*.8) cls='warn'; }
    if (cls==='bad') txt = '⚠ เกินลิมิต · ' + txt;
  }
  h.textContent = txt; h.className = 'hint ' + cls;
}
function saveEntry(){
  const amount = Math.round((parseFloat(S.amt)||0)*100)/100;
  if (!(amount>0)) { toast('ใส่จำนวนเงินก่อนนะ'); $('#amt') && $('#amt').focus(); return; }
  const prevState = S.model.state.n;
  const e = {id: Date.now().toString(36)+Math.random().toString(36).slice(2,7), date:S.addDate, type:S.addType, cat:S.addCat, amount, note:S.note.trim()};
  applyLocal(S.data, e); setData(S.data);
  S.amt = ''; S.note = '';
  const l = S.model.limits.find(x=>x.cat===e.cat);
  if (S.model.state.n !== prevState) toast(`สถานะเปลี่ยนเป็น “${S.model.state.t}” (${Math.round(S.model.pct*100)}%)`, 3600);
  else if (e.type==='exp' && l && (l.dOver||l.mOver)) toast(`⚠ ${esc(e.cat)} เกินลิมิตแล้ว`, 3200);
  else toast(`บันทึก ${esc(e.cat)} ${baht(amount)} แล้ว · เหลือ ${Math.round(S.model.pct*100)}%`);
  if (document.activeElement) document.activeElement.blur();
  renderAdd();
  if (CFG && !CFG.demo) { QUEUE.push(e); LS.set('mq_queue', QUEUE); flushQueue(); }
  else { Mock.addEntries([e]); }
}

function editItemSheet(date, t, c, i){
  const d = S.model.byDate[date];
  const it = itemsOf(d).find(x => x.t===t && x.c===c && x.i===i);
  if (!it) return toast('ไม่พบรายการ');
  const cats = t==='inc' ? S.model.incOrder : S.model.expOrder;
  let sel = c;
  openSheet(`<h3>แก้ไขรายการ</h3>
    <div class="muted" style="font-size:13px">${thDate(date,true)} · ${t==='inc'?'รายรับ':'รายจ่าย'}</div>
    <label class="f">จำนวนเงิน (บาท)</label>
    <input type="text" id="eAmt" class="num" inputmode="decimal" value="${it.a}" style="font-size:22px;font-weight:600">
    <label class="f">หมวด</label>
    <div class="cats mini" id="eCats">${cats.map(x=>`<button type="button" class="cat ${x===c?'on':''}" data-c="${esc(x)}"><span class="e">${icon(x)}</span><span class="n">${esc(x)}</span></button>`).join('')}</div>
    <div class="edit-actions">
      <button class="btn danger" id="eDel">ลบรายการ</button>
      <button class="btn primary" id="eSave">บันทึกการแก้ไข</button>
    </div>`);
  $$('#eCats .cat').forEach(el => el.addEventListener('click', () => { sel = el.dataset.c; $$('#eCats .cat').forEach(x=>x.classList.toggle('on', x===el)); }));
  const busy = (b, txt) => { $('#eSave').disabled = $('#eDel').disabled = b; if (txt) (b ? null : null); };
  $('#eSave').addEventListener('click', async () => {
    const v = Math.round((parseFloat($('#eAmt').value.replace(/,/g,''))||0)*100)/100;
    if (!(v>0)) return toast('จำนวนเงินไม่ถูกต้อง');
    if (v===it.a && sel===c) return closeSheet();
    busy(true); $('#eSave').textContent = 'กำลังบันทึก…';
    if (await doEdit({date, type:t, cat:c, index:i, amount:it.a, newCat:sel, newAmount:v})) { closeSheet(); toast('แก้ไขแล้ว'); }
    else { busy(false); $('#eSave').textContent = 'บันทึกการแก้ไข'; }
  });
  $('#eDel').addEventListener('click', async () => {
    if (!confirm(`ลบ ${c} ${baht(it.a)} ของ${thDate(date,true)}?`)) return;
    busy(true); $('#eDel').textContent = 'กำลังลบ…';
    if (await doEdit({date, type:t, cat:c, index:i, amount:it.a, del:true})) { closeSheet(); toast('ลบรายการแล้ว'); }
    else { busy(false); $('#eDel').textContent = 'ลบรายการ'; }
  });
}
async function doEdit(p){
  if (CFG && !CFG.demo && QUEUE.length) {
    await flushQueue();
    if (QUEUE.length) { toast('ต้องส่งรายการที่ค้างขึ้นชีตก่อน (ต้องออนไลน์)', 3500); return false; }
  }
  try { const D = await api('editItem', p); receive(D); return true; }
  catch(e) { toast('❌ '+esc(errMsg(e)), 4000); return false; }
}

function sparkSVG(arr, up){

  const pts = arr.map((v,i)=>`${(i/(arr.length-1)*64).toFixed(1)},${(24-(v-mn)/r*22).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 64 26"><polyline points="${pts}" fill="none" stroke="var(${up?'--pos':'--neg'})" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

      <div style="height:14px"></div><button class="btn primary block" onclick="saveBudget()">บันทึก</button>
    </div>

    <div class="sec-t">การแจ้งเตือน</div>
    <div class="card">
      <div class="lrow" style="padding-top:0"><div><div class="t">เตือนทุกวันทางอีเมล</div><div class="s">ส่งไปที่ ${esc(D.email||'')} · iPhone เด้งผ่านแอป Gmail</div></div><div class="r"><label class="sw"><input type="checkbox" id="sRem" ${st.reminder?.enabled?'checked':''}><span></span></label></div></div>
      <label class="f">เวลาเตือน</label>
      <select id="sHour">${Array.from({length:24},(_,h)=>`<option value="${h}" ${+st.reminder?.hour===h?'selected':''}>${String(h).padStart(2,'0')}:00 น.</option>`).join('')}</select>
      <div class="faint" style="font-size:12.5px;margin-top:8px">เช็กให้ทุกวัน: ยังไม่บันทึก · เกิน/ใกล้ลิมิต · บิลครบกำหนดพรุ่งนี้ · สรุปเดือนก่อน (วันที่ 1)</div>
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" style="flex:1" onclick="saveRem()">บันทึก</button><button class="btn" onclick="testNoti()">ทดสอบส่ง</button></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>บิล / ค่าใช้จ่ายประจำ</h3></div>
      ${(st.bills||[]).map((b,i)=>`<div class="lrow"><div class="ic">📅</div><div><div class="t">${esc(b.name)}</div><div class="s">ทุกวันที่ ${b.day}${b.amount?' · '+baht(b.amount):''}</div></div><div class="r"><button class="iconbtn" style="width:34px;height:34px;color:var(--neg)" onclick="delBill(${i})">${I.x}</button></div></div>`).join('') || '<div class="empty">ยังไม่มี</div>'}
      <div class="inline3" style="margin-top:10px"><input type="text" id="bName" placeholder="ชื่อบิล"><input type="number" id="bDay" placeholder="วันที่" min="1" max="31"><input type="number" id="bAmt" placeholder="บาท"></div>
      <div style="height:8px"></div><button class="btn block" onclick="addBill()">+ เพิ่มบิล</button>
    </div>

    <div class="sec-t">การลงทุน</div>
    <div class="card">
      <div class="card-h"><h3>หุ้น / สินทรัพย์</h3></div>
      <div class="tags">${(st.watchlist||[]).map((s,i)=>`<span class="tag">${esc(s)}<button onclick="delWatch(${i})">✕</button></span>`).join('')}</div>
      <div style="display:flex;gap:8px;margin-top:10px"><input type="text" id="wSym" placeholder="KBANK.BK, TSLA, BTC-USD" autocapitalize="characters"><button class="btn" onclick="addWatch()">เพิ่ม</button></div>
      <div class="faint" style="font-size:12.5px;margin-top:8px">หุ้นไทยเติม .BK · ดัชนี SET = ^SET.BK · ทองคำโลก = GC=F</div>
      <div class="card-h" style="margin-top:16px"><h3>สกุลเงิน</h3></div>
      <div class="tags">${(st.fx||[]).map((s,i)=>`<span class="tag">${esc(s)}<button onclick="delFx(${i})">✕</button></span>`).join('')}</div>
      <div style="display:flex;gap:8px;margin-top:10px"><select id="fxSel">${Object.keys(FX_NAME).filter(c=>!(st.fx||[]).includes(c)).map(c=>`<option value="${c}">${FX_NAME[c]} (${c})</option>`).join('')}</select><button class="btn" onclick="addFx()">เพิ่ม</button></div>
    </div>

    <div class="sec-t">ชีตและหมวดหมู่</div>
    <div class="card">
      <button class="btn block" onclick="newCategory()">+ เพิ่มหมวดใหม่ (แทรกคอลัมน์ในชีต)</button>
      <div style="height:8px"></div>
      <button class="btn block" onclick="repair()">ซ่อมสูตร sum / net ให้รวมทุกหมวด</button>
      <div class="faint" style="font-size:12.5px;margin-top:8px">เขียนสูตรในคอลัมน์ sum และ net ใหม่ทุกแถว ข้อมูลที่กรอกไว้ไม่ถูกแตะ ย้อนกลับได้จากประวัติเวอร์ชันของชีต</div>
    </div>
    <div class="sec-t">การเชื่อมต่อ</div>
    <div class="card">
      ${CFG && !CFG.demo
        ? `<div class="lrow" style="padding-top:0"><div style="min-width:0"><div class="t">เชื่อมกับ Google Sheet แล้ว</div><div class="s" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(CFG.url)}</div></div></div>
           <div style="display:flex;gap:8px;margin-top:6px"><button class="btn" style="flex:1" onclick="refresh().then(()=>toast('โหลดข้อมูลล่าสุดแล้ว'))">${I.refresh} ซิงก์ตอนนี้</button><button class="btn danger" onclick="if(confirm('ตัดการเชื่อมต่อในเครื่องนี้?')) resetConn()">ตัดการเชื่อมต่อ</button></div>
           ${QUEUE.length?`<div class="faint" style="font-size:12.5px;margin-top:8px">มี ${QUEUE.length} รายการรอส่งขึ้นชีต</div>`:''}`
        : `<div class="t" style="margin-bottom:8px">ตอนนี้เป็นโหมดตัวอย่าง</div><button class="btn primary block" onclick="resetConn()">เชื่อมต่อ Google Sheet</button>`}
    </div>
    <div class="faint" style="font-size:12.5px;text-align:center;margin:16px 0 4px">ติดตั้งบน iPhone: เปิดใน Safari → แชร์ → เพิ่มไปยังหน้าจอโฮม</div>`;
}
async function persist(msg){
  try { S.data.settings = await api('saveSettings', S.data.settings); if (CFG && !CFG.demo) { const c = LS.get('mq_data', null); if (c) { c.settings = S.data.settings; LS.set('mq_data', c); } } setData(S.data); rerender(); if (msg) toast(msg); }
  catch(e){ toast('❌ '+esc(errMsg(e)),4000); }
}
function limitForm(cat){
  const st = S.data.settings, l = (cat && st.limits[cat]) || {daily:'',monthly:''};
  openSheet(`<h3>${cat?'แก้ไข':'เพิ่ม'}ลิมิต</h3>
    <label class="f">หมวด</label><select id="lCat" ${cat?'disabled':''}>${S.data.expenseCats.map(c=>`<option ${c===cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
    <label class="f">ไม่เกิน (บาท/วัน) · เว้นว่าง = ไม่จำกัด</label><input type="number" id="lD" value="${+l.daily||''}" inputmode="decimal">
    <label class="f">ไม่เกิน (บาท/เดือน) · เว้นว่าง = ไม่จำกัด</label><input type="number" id="lM" value="${+l.monthly||''}" inputmode="decimal">
    <div style="height:16px"></div><button class="btn primary block" id="lSave">บันทึก</button>`);
  $('#lSave').onclick = () => {
    const c = cat || $('#lCat').value, d = +$('#lD').value||0, m = +$('#lM').value||0;
    if (!d && !m) return toast('ใส่ลิมิตอย่างน้อย 1 อย่าง');
    S.data.settings.limits = {...S.data.settings.limits, [c]:{daily:d, monthly:m}};
    closeSheet(); persist('ตั้งลิมิต '+esc(c)+' แล้ว');
  };
}
function delLimit(c){ if(!confirm('ลบลิมิต '+c+'?')) return; delete S.data.settings.limits[c]; persist('ลบลิมิตแล้ว'); }
function saveBudget(){ const st=S.data.settings; st.payday=clamp(+$('#sPay').value||0,0,31); st.savingGoalPct=clamp(+$('#sGoal').value||0,0,90); st.dailyBudget=+$('#sDaily').value||0; persist('บันทึกแล้ว'); }
function saveRem(){ S.data.settings.reminder = {enabled:$('#sRem').checked, hour:+$('#sHour').value, email:true}; persist($('#sRem').checked?'เปิดแจ้งเตือนเวลา '+$('#sHour').value+':00 น.':'ปิดแจ้งเตือนแล้ว'); }
async function testNoti(){ try{ await api('testNotification'); toast('ส่งอีเมลทดสอบแล้ว ลองดูใน Gmail'); }catch(e){ toast('❌ '+esc(errMsg(e)),4000); } }
function addBill(){ const n=$('#bName').value.trim(), d=+$('#bDay').value, a=+$('#bAmt').value||0; if(!n||!(d>=1&&d<=31)) return toast('ใส่ชื่อและวันที่ (1–31)'); S.data.settings.bills=[...(S.data.settings.bills||[]),{name:n,day:d,amount:a}]; persist('เพิ่มบิลแล้ว'); }
function delBill(i){ S.data.settings.bills.splice(i,1); persist(); }
function addWatch(){ const s=$('#wSym').value.trim().toUpperCase(); if(!s) return; if((S.data.settings.watchlist||[]).includes(s)) return toast('มีอยู่แล้ว'); S.data.settings.watchlist=[...(S.data.settings.watchlist||[]),s]; S.market=null; persist('เพิ่ม '+esc(s)); }
function delWatch(i){ S.data.settings.watchlist.splice(i,1); S.market=null; persist(); }
function addFx(){ const c=$('#fxSel').value; if(!c) return; S.data.settings.fx=[...(S.data.settings.fx||[]),c]; S.market=null; persist('เพิ่ม '+c); }
function delFx(i){ S.data.settings.fx.splice(i,1); S.market=null; persist(); }
async function repair(){
  if (!confirm('เขียนสูตร sumรายรับ / sumรายจ่าย / net ใหม่ทุกแถวให้รวมทุกหมวด?\n(ข้อมูลที่กรอกไม่ถูกแก้ ย้อนได้จากประวัติเวอร์ชัน)')) return;
  try { receive(await api('repairFormulas')); toast('ซ่อมสูตรแล้ว ยอดในชีตตรงกับแอป'); } catch(e){ toast('❌ '+esc(errMsg(e)),4000); }
}

/* =========================================================
   Theme / Navigation / Boot
   ========================================================= */
function setTheme(k, save){
  document.documentElement.dataset.theme = k;
  try { localStorage.setItem('mq_theme', k); } catch(e) {}
  $('#themeBtn').innerHTML = k==='dark' ? I.moon : k==='light' ? I.sun : I.leaf;
  const meta = document.querySelector('meta[name=theme-color]') || Object.assign(document.head.appendChild(document.createElement('meta')), {name:'theme-color'});
  meta.content = cssv('--bg');
  if (S.data) { rerender(); if (save) { S.data.settings.theme = k; api('saveSettings', S.data.settings).catch(()=>{}); } }
}
$('#themeBtn').onclick = () => { const order=['dark','light','earth']; const cur=document.documentElement.dataset.theme; setTheme(order[(order.indexOf(cur)+1)%3], true); toast('ธีม '+THEMES.find(t=>t.k===document.documentElement.dataset.theme).n, 1200); };

const TABS = [['home','หน้าหลัก',I.home],['stats','สรุป',I.chart],['add','บันทึก',I.plus],['market','ตลาด',I.trend],['settings','ตั้งค่า',I.gear]];
$('#tabs').innerHTML = TABS.map(([v,l,ic])=> v==='add'
  ? `<button class="tab add" data-v="add" aria-label="บันทึก"><span class="pl">${ic}</span></button>`
  : `<button class="tab" data-v="${v}">${ic}<span>${l}</span></button>`).join('');
$$('.tab').forEach(t => t.onclick = () => go(t.dataset.v));

function setData(D){
  if (CFG && !CFG.demo) D.today = iso(new Date());
  S.data = D; S.model = buildModel(D);
  const h = new Date().getHours();
  $('#hiLbl').textContent = (h<12?'อรุณสวัสดิ์':h<17?'สวัสดีตอนบ่าย':'สวัสดีตอนเย็น') + ' · ' + thDate(D.today, true);
}
function rerender(){ ({home:renderHome, add:renderAdd, stats:renderStats, market:renderMarket, settings:renderSettings})[S.view](); }
function go(v){
  S.view = v; S.preview = null;
  document.body.className = 'v-'+v;
  $$('.view').forEach(e=>e.classList.toggle('on', e.id==='v-'+v));
  $$('.tab').forEach(t=>t.classList.toggle('on', t.dataset.v===v));
  if (v!=='stats') killCharts();
  rerender(); window.scrollTo({top:0});
}

function resetConn(){
  if (QUEUE.length && !confirm('ยังมีรายการรอส่ง '+QUEUE.length+' รายการ จะหายถ้าตัดการเชื่อมต่อ ดำเนินการต่อ?')) return;
  LS.del('mq_cfg'); LS.del('mq_data'); LS.del('mq_queue'); LS.del('mq_market');
  CFG = null; QUEUE = []; location.hash = ''; location.reload();
}
function showSetup(){
  document.querySelector('.top').style.display = 'none';
  document.querySelector('.tabs').style.display = 'none';
  $('#boot').className = '';
  $('#boot').innerHTML = `<div class="setup">
    <img src="${sprite(1)}" alt="">
    <h2>Money Quest</h2>
    <div class="muted" style="font-size:14px;margin-bottom:16px">เชื่อมต่อกับ Google Sheet ของคุณ (ทำครั้งเดียวต่อเครื่อง)</div>
    <div class="card">
      <label class="f" style="margin-top:0">ลิงก์ API (Apps Script ที่ลงท้ายด้วย <code>/exec</code>)</label>
      <input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off">
      <label class="f">รหัสลับ (จาก setupToken)</label>
      <input type="text" id="cfgTok" placeholder="รหัส 40 ตัวอักษร" autocapitalize="off" autocorrect="off">
      <div style="height:14px"></div>
      <button class="btn primary block" id="cfgGo">เชื่อมต่อ</button>
      <div id="cfgErr" class="neg" style="font-size:13px;margin-top:8px"></div>
    </div>
    <button class="link" id="cfgDemo">ลองโหมดตัวอย่างก่อน</button>
  </div>`;
  $('#cfgDemo').onclick = () => { LS.set('mq_cfg', {demo:true}); location.reload(); };
  $('#cfgGo').onclick = async () => {
    const url = $('#cfgUrl').value.trim(), token = $('#cfgTok').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { $('#cfgErr').textContent = 'ลิงก์ต้องขึ้นต้นด้วย https://script.google.com/ และลงท้ายด้วย /exec'; return; }
    if (!token) { $('#cfgErr').textContent = 'ใส่รหัสลับด้วย'; return; }
    const b = $('#cfgGo'); b.disabled = true; b.textContent = 'กำลังเชื่อมต่อ…'; $('#cfgErr').textContent = '';
    try {
      const D = await callApi({url, token}, 'getAppData', []);
      CFG = {url, token}; LS.set('mq_cfg', CFG); LS.set('mq_data', D);
      const appUrl = location.origin + location.pathname;
      if (D.settings.appUrl !== appUrl) { D.settings.appUrl = appUrl; callApi(CFG, 'saveSettings', [D.settings]).catch(()=>{}); }
      location.reload();
    } catch(e) { $('#cfgErr').textContent = errMsg(e); b.disabled = false; b.textContent = 'เชื่อมต่อ'; }
  };
}
function start(D){
  setData(D);
  let saved = null; try { saved = localStorage.getItem('mq_theme'); } catch(e) {}
  if (!saved && D.settings.theme) setTheme(D.settings.theme);
  $('#boot') && $('#boot').remove();
  const hash = (location.hash||'').slice(1);
  go(TABS.some(t=>t[0]===hash) ? hash : 'home');
  syncUI();
}

(async function boot(){
  setTheme(document.documentElement.dataset.theme || 'dark');
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
  if (!CFG) return showSetup();
  if (CFG.demo) { $('#demoNote').style.display='block'; return start(Mock.getAppData()); }
  // แสดงข้อมูลล่าสุดที่เก็บในเครื่องทันที แล้วค่อยโหลดใหม่เบื้องหลัง
  const cached = LS.get('mq_data', null);
  if (cached) {
    const copy = JSON.parse(JSON.stringify(cached)); QUEUE.forEach(e => applyLocal(copy, e));
    start(copy); flushQueue().then(refresh);
  } else {
    try { const D = await api('getAppData'); LS.set('mq_data', D); start(D); }
    catch(e) { $('#boot').innerHTML = `<div class="alert bad">โหลดข้อมูลไม่สำเร็จ: ${esc(errMsg(e))}</div><button class="btn block" onclick="location.reload()">ลองใหม่</button><div style="height:8px"></div><button class="btn block" onclick="resetConn()">ตั้งค่าการเชื่อมต่อใหม่</button>`; }
  }
})();
</script>
</body>
</html>
